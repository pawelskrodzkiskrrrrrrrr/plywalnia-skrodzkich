<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0A3A66">
<title>Pływalnia Skrodzkich</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E5C97'/%3E%3Cpath d='M4 20q3-3 6 0t6 0 6 0 6 0M4 25q3-3 6 0t6 0 6 0 6 0' stroke='%23fff' stroke-width='2.2' fill='none'/%3E%3Ccircle cx='20' cy='10' r='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF5F9; --surface:#FFFFFF; --surface-2:#F4F9FC; --line:#D5E4EE; --line-strong:#B7CFDF;
  --ink:#0B2236; --ink-2:#3C566B; --ink-3:#6B8497;
  --water-1:#0A3A66; --water-2:#0E5C97; --water-lane:rgba(255,255,255,.10); --on-water:#FFFFFF; --on-water-2:#BFE3F6;
  --rope-r:#D7263D; --rope-w:#F4F4F4; --rope-b:#1B4F9C;
  --accent:#0E6CC0; --accent-ink:#FFFFFF; --accent-soft:#E1EFFA;
  --gold:#C99A1B; --gold-soft:#FBF1D2; --gold-ink:#6E5205;
  --good:#1D8A5B; --bad:#B8412F;
  --k0:#1F6FD1; --k1:#E0662F; --k2:#159B72;
  --shadow:0 1px 2px rgba(11,34,54,.06),0 6px 20px rgba(11,34,54,.06);
  --r:10px;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#07131F; --surface:#0B1D2E; --surface-2:#0F2438; --line:#1B3650; --line-strong:#27496A;
  --ink:#E6F0F7; --ink-2:#A9C0D2; --ink-3:#7891A6;
  --water-1:#041A30; --water-2:#07345A; --water-lane:rgba(255,255,255,.07); --on-water:#F2F8FC; --on-water-2:#8FC3E3;
  --accent:#4A8EEA; --accent-ink:#04121F; --accent-soft:#12304D;
  --gold:#E2B43A; --gold-soft:#3A2F10; --gold-ink:#F4D57E;
  --good:#3CC08A; --bad:#EE7A63;
  --k0:#4A8EEA; --k1:#DD6E35; --k2:#1FA077;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#07131F; --surface:#0B1D2E; --surface-2:#0F2438; --line:#1B3650; --line-strong:#27496A;
  --ink:#E6F0F7; --ink-2:#A9C0D2; --ink-3:#7891A6;
  --water-1:#041A30; --water-2:#07345A; --water-lane:rgba(255,255,255,.07); --on-water:#F2F8FC; --on-water-2:#8FC3E3;
  --accent:#4A8EEA; --accent-ink:#04121F; --accent-soft:#12304D;
  --gold:#E2B43A; --gold-soft:#3A2F10; --gold-ink:#F4D57E;
  --good:#3CC08A; --bad:#EE7A63;
  --k0:#4A8EEA; --k1:#DD6E35; --k2:#1FA077;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* ---------- pool header ---------- */
.pool{position:relative;color:var(--on-water);
  background:
    repeating-linear-gradient(180deg,transparent 0 46px,var(--water-lane) 46px 48px),
    linear-gradient(160deg,var(--water-1),var(--water-2));
  overflow:hidden}
.pool::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 60% at 80% -10%,rgba(127,214,232,.25),transparent 60%)}
.pool .wrap{position:relative;z-index:1;padding-block:22px 18px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--on-water-2)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,52px);line-height:.95;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.rope{height:8px;background:repeating-linear-gradient(90deg,var(--rope-r) 0 14px,var(--rope-w) 14px 22px,var(--rope-b) 22px 36px,var(--rope-w) 36px 44px)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.tab:focus-visible,.lane:focus-visible,.seg button:focus-visible,th button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.onwater{background:#FFFFFF;color:#0A3A66;border-color:#FFFFFF}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- lanes (kid tabs) ---------- */
.lanes{display:flex;gap:8px;flex-wrap:wrap;padding-block:16px 4px}
.lane{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;cursor:pointer;min-height:44px}
.lane .no{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;color:#fff;background:var(--kc);border-radius:999px;padding:3px 9px;text-transform:uppercase}
.lane .nm{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em}
.lane .ct{color:var(--ink-3);font-size:13px}
.lane[aria-selected="true"]{border-color:var(--kc);box-shadow:inset 0 0 0 1px var(--kc);background:var(--surface)}

/* ---------- summary ---------- */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
.stat{background:var(--surface);padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .lbl{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.stat .val{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05}
.stat .sub{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:720px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:20px 0 12px}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line)}
.tab{background:none;border:0;padding:8px 14px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:14px;color:var(--ink-2);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg-label{font-size:13px;color:var(--ink-3);margin-right:6px}
.filters{display:flex;align-items:center;flex-wrap:wrap;gap:6px}

/* ---------- PB cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--accent)}
.card .ev{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .ev b{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.02em}
.card .ev span{font-size:12px;color:var(--ink-3);white-space:nowrap}
.card .pb{display:flex;align-items:center;gap:10px}
.card .t{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;letter-spacing:.01em}
.medal{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE9A3,var(--gold) 60%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.08);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:11px;color:#5A4203;flex:none}
.card .meta{font-size:13px;color:var(--ink-2)}
.card .prog{display:flex;justify-content:space-between;align-items:end;gap:8px;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.card .prog small{font-size:12px;color:var(--ink-3);display:block}
.card .prog .d{font-weight:600;color:var(--good);font-size:14px}
.spark{width:110px;height:34px;flex:none}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:separate;border-spacing:0;font-size:14px;min-width:100%}
th,td{padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{position:sticky;top:0;background:var(--surface-2);vertical-align:bottom;z-index:1}
th.ev,td.ev{position:sticky;left:0;background:var(--surface);z-index:2;text-align:left;padding:8px 12px;border-right:1px solid var(--line);font-weight:600;min-width:150px}
thead th.ev{z-index:3;background:var(--surface-2);font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--ink-3)}
td.pbcol{padding:8px 12px;font-family:var(--display);font-weight:700;font-size:17px;border-right:1px solid var(--line);background:var(--gold-soft);color:var(--gold-ink);text-align:right}
th.pbcol{padding:8px 12px;font-family:var(--display);font-size:12px;letter-spacing:.1em;color:var(--gold-ink);background:var(--gold-soft);border-right:1px solid var(--line)}
th.m button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:8px 10px;width:118px;white-space:normal;box-sizing:border-box}
th.m button:hover .mn{color:var(--accent);text-decoration:underline}
th.m .md{font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink)}
th.m .mn{font-size:12px;color:var(--ink-2);line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}
th.m .tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;padding:0 6px;border-radius:4px;background:var(--accent-soft);color:var(--ink-2);font-weight:600;line-height:18px}
.tag.warn{background:transparent;border:1px dashed var(--line-strong)}
td.c{text-align:right;padding:8px 10px;font-variant-numeric:tabular-nums;color:var(--ink)}
td.c.empty{color:var(--line-strong)}
td.c .cell{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:5px}
td.c.hist .cell{box-shadow:inset 0 0 0 1px var(--gold)}
td.c.cur .cell{background:var(--gold);color:#241900;font-weight:700}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:hover td.c.cur .cell{background:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink-2);margin-top:10px;align-items:center}
.legend i{display:inline-block;width:26px;height:16px;border-radius:4px;vertical-align:middle;margin-right:6px}

/* ---------- chart ---------- */
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.chart-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:6px}
.chart-head h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;letter-spacing:.02em}
.chart-head .sub{font-size:13px;color:var(--ink-3)}
select.inp,input.inp,textarea.inp{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:40px;max-width:100%}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2);cursor:pointer}
.chart-box{position:relative}
.chart-box svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.35;box-shadow:var(--shadow);max-width:240px;z-index:5}
.tip b{font-family:var(--display);font-size:18px}
.tip .row{display:flex;align-items:center;gap:6px}
.tip .sw{width:10px;height:10px;border-radius:50%;flex:none}
.klegend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:6px}
.klegend span{display:inline-flex;align-items:center;gap:6px}
.klegend i{width:18px;height:3px;border-radius:2px;display:inline-block}

/* ---------- panel / form ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,18,31,.55);z-index:50;display:flex;justify-content:flex-end}
.panel{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.panel-head{background:linear-gradient(160deg,var(--water-1),var(--water-2));color:var(--on-water);padding:calc(16px + env(safe-area-inset-top,0px)) 20px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.panel-head h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:26px;margin:0;letter-spacing:.03em}
.panel-head .x{background:none;border:0;color:var(--on-water);font-size:28px;cursor:pointer;line-height:1;padding:4px 8px}
.panel-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px;flex:1}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label,.fld .lb{font-size:13px;font-weight:600;color:var(--ink-2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.row2{grid-template-columns:1fr}}
.rs{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 116px 40px;gap:8px;align-items:start}
.rrow .hint{grid-column:1/-1;font-size:12px;margin-top:-4px}
.hint{font-size:12px;color:var(--ink-3)}
.hint.pb{color:var(--gold-ink);font-weight:600}
.hint.err{color:var(--bad);font-weight:600}
.iconbtn{width:40px;height:40px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;cursor:pointer;color:var(--ink-3);font-size:18px}
.panel-foot{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.confirm{background:var(--surface);border:1px solid var(--bad);border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.formerr{color:var(--bad);font-weight:600;font-size:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:60;max-width:calc(100% - 32px);font-size:14px}
.toast.gold{background:var(--gold);color:#241900;font-weight:600}
.state{padding:40px 16px;text-align:center;color:var(--ink-2)}
.state h3{font-family:var(--display);font-size:24px;margin:0 0 6px;color:var(--ink)}
footer{padding-block:28px 40px;color:var(--ink-3);font-size:13px}
@media (prefers-reduced-motion:no-preference){.lane,.card,.btn{transition:border-color .15s,box-shadow .15s}}
@media (max-width:560px){.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding-top:12px}.lane{gap:6px;padding:6px 8px 6px 6px;justify-content:flex-start;min-width:0}.lane .no{font-size:11px;padding:2px 6px}.lane .ct{display:none}.lane .nm{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card .t{font-size:34px}.tab{padding:8px 10px;font-size:15px}}

/* ---------- meet list (widok listy zawodów) ---------- */
.lf{display:inline}.ls{display:none}
.mlist{display:flex;flex-direction:column;gap:10px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mcard-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--surface-2);border:0;border-bottom:1px solid var(--line);width:100%;cursor:pointer;text-align:left;min-height:48px}
.mcard-h:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.mcard-h .d{font-family:var(--display);font-weight:700;font-size:19px;display:block}
.mcard-h .n{font-size:13px;color:var(--ink-2);display:block}
.mcard-h .tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.mcard-h .ed{font-size:13px;color:var(--accent);font-weight:600;white-space:nowrap;padding-top:2px}
.mres{list-style:none;margin:0;padding:0}
.mres li{display:grid;grid-template-columns:minmax(0,1fr) auto 76px;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.mres li:first-child{border-top:0}
.mres .e{font-weight:600;min-width:0}
.mres .t{font-family:var(--display);font-weight:700;font-size:21px;text-align:right}
.mres .t.cur{background:var(--gold);color:#241900;border-radius:5px;padding:0 6px}
.mres .t.hist{box-shadow:inset 0 0 0 1px var(--gold);border-radius:5px;padding:0 6px}
.dl{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.dl.up{color:var(--good);font-weight:600}.dl.down{color:var(--bad)}.dl.na{color:var(--ink-3)}
.pbchip{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--gold);color:#241900;margin-left:6px;vertical-align:1px;white-space:nowrap}
.pbchip.hist{background:transparent;box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold-ink)}
.mnote{padding:8px 14px 12px;font-size:13px;color:var(--ink-3);border-top:1px dashed var(--line)}
.tblbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tblbar .ctl{display:flex;gap:8px;flex-wrap:wrap}
.fab{display:none}

/* ---------- telefon ---------- */
@media (max-width:640px){
  body{font-size:15px}
  .pool .wrap{padding-block:14px 12px}
  .eyebrow{font-size:11px}
  #addBtn{display:none}
  .fab{display:inline-flex;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:0 20px;font-weight:700;font-size:16px;box-shadow:0 6px 20px rgba(4,18,31,.35);cursor:pointer;min-height:54px}
  .fab:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  main.wrap{padding-bottom:88px}
  .summary{margin-top:8px}
  .stat{padding:10px 12px}.stat .val{font-size:24px}.stat .lbl{font-size:11px}
  .toolbar{flex-direction:column;align-items:stretch;gap:10px;margin:16px 0 12px}
  .tabs{width:100%}.tab{flex:1;text-align:center;min-height:44px}
  .filters{width:100%}.filters .seg{flex:1}
  .seg{display:flex}.seg button{flex:1;min-height:40px}
  .tblbar .ctl{width:100%}.tblbar .ctl .seg{flex:1 1 100%}
  .cards{grid-template-columns:1fr}
  .lf{display:none}.ls{display:inline}
  th.ev,td.ev{min-width:0;width:84px;white-space:normal;padding:8px;font-size:13px}
  td.pbcol,th.pbcol{padding:8px 6px;font-size:15px}
  th.m button{width:92px;padding:8px 6px}
  td.c{padding:8px 6px}
  .chart-card{padding:12px}
  .chart-head h2{font-size:21px}
  .chart-head>.filters{flex-direction:column;align-items:stretch}
  .chart-head select{width:100%}
  .rrow{grid-template-columns:minmax(0,1fr) 44px}
  .rrow select{grid-column:1/-1}
  .rrow .iconbtn{width:44px;height:40px}
  .panel-head h2{font-size:22px}
  .panel-body{padding:16px}
  .panel-foot{padding-inline:16px}
